services:
  - type: web
    name: hybrid-fit-workout-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: STRAVA_CLIENT_ID
        value: ""
      - key: STRAVA_CLIENT_SECRET
        value: ""
      - key: APP_URL
        value: ""
